[project]
name = "generate-image"
version = "2.5.0"
description = "Capability-routed multi-provider image generation with img2img, Seedream sequences, DAG scheduling, and bounded acceptance-loop flows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "pyyaml>=6.0",
]

[project.scripts]
generate-image = "generate_image.cli:main"
generate-image-models = "generate_image.list_models:main"
generate-image-probe = "generate_image.probe:main"
generate-image-doctor = "generate_image.doctor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/generate_image"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
