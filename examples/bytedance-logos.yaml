    prompt: "Modern tech-company department logo in ByteDance-inspired visual language: a bold vibrant pink-to-coral gradient rounded-square app icon with a minimal geometric white glyph of a pen nib and a bezier-curve node, clean flat vector, playful yet professional, centered on a soft white background, crisp high-contrast edges; below the icon the department name 'Design' in a modern geometric sans-serif. No photorealism, no clutter."
